name: ci

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Format check
        working-directory: apps/api
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: apps/api
        run: go vet ./...

      - name: Test
        working-directory: apps/api
        run: go test ./...
